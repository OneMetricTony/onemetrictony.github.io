<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIRA RoboWorld Cup 2026</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #07070d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3.5rem;
      padding: 2.5rem 1.5rem;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .eyebrow {
      color: rgba(255,255,255,0.28);
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-align: center;
    }

    /* ── Logo cards ── */
    .links {
      display: flex;
      gap: 4rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
    }

    .link-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      text-decoration: none;
      cursor: pointer;
    }

    .logo-ring {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logo-ring img,
    .logo-ring svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Staggered breathing — scale + glow */
    .link-card:nth-child(1) .logo-ring {
      animation: breathe-cnrs 4.2s ease-in-out infinite;
    }
    .link-card:nth-child(2) .logo-ring {
      animation: breathe-gh 3.7s ease-in-out infinite 0.6s;
    }
    .link-card:nth-child(3) .logo-ring {
      animation: breathe-fira 4.6s ease-in-out infinite 1.1s;
    }

    @keyframes breathe-cnrs {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 4px rgba(200,16,46,0.25));
      }
      50% {
        transform: scale(1.10);
        filter: drop-shadow(0 0 22px rgba(200,16,46,0.65)) drop-shadow(0 0 8px rgba(200,16,46,0.4));
      }
    }
    @keyframes breathe-gh {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 4px rgba(255,255,255,0.1));
      }
      50% {
        transform: scale(1.10);
        filter: drop-shadow(0 0 22px rgba(255,255,255,0.45)) drop-shadow(0 0 8px rgba(255,255,255,0.25));
      }
    }
    @keyframes breathe-fira {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 4px rgba(240,57,78,0.25));
      }
      50% {
        transform: scale(1.10);
        filter: drop-shadow(0 0 22px rgba(240,57,78,0.7)) drop-shadow(0 0 8px rgba(240,57,78,0.4));
      }
    }

    .link-label {
      color: rgba(255,255,255,0.45);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
      transition: color 0.2s;
    }
    .link-card:hover .link-label { color: rgba(255,255,255,0.85); }
    .link-card:hover .logo-ring  { animation-play-state: paused; }

    /* ── QR section ── */
    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    #qrcode {
      /* canvas injected here */
      border-radius: 6px;
      overflow: hidden;
    }

    .qr-label {
      color: rgba(255,255,255,0.2);
      font-size: 0.6rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-ring { animation: none !important; }
    }

    @media (max-width: 480px) {
      .links { gap: 2.5rem; }
      .logo-ring { width: 100px; height: 100px; }
    }
  </style>
</head>
<body>

  <p class="eyebrow">FIRA RoboWorld Cup 2026 &nbsp;·&nbsp; Markham, Canada</p>

  <nav class="links" aria-label="Official links">

    <!-- 1 · CNRS -->
    <a class="link-card" href="https://cnrs.ngo" target="_blank" rel="noopener noreferrer"
       aria-label="Canadian National Robotic Society — cnrs.ngo">
      <div class="logo-ring">
        <img src="assets/cnrs-logo-official.png" alt="CNRS logo">
      </div>
      <span class="link-label">CNRS</span>
    </a>

    <!-- 2 · Personal / GitHub sponsorship page -->
    <a class="link-card"
       href="https://onemetrictony.github.io/FIRARobocup2026/sponsorship.html?lang=en"
       target="_blank" rel="noopener noreferrer"
       aria-label="Sponsorship information on GitHub Pages">
      <div class="logo-ring">
        <!-- GitHub mark (public brand asset) -->
        <svg viewBox="0 0 98 96" xmlns="http://www.w3.org/2000/svg"
             fill="white" role="img" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405
               46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127
               -13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17
               -4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052
               4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6
               -10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2
               -.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97
               46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356
               13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422
               5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548
               3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853
               3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788
               0 48.854 0z"/>
        </svg>
      </div>
      <span class="link-label">Sponsorship Info</span>
    </a>

    <!-- 3 · AVISengine teams page -->
    <a class="link-card"
       href="https://events.avisengine.com/dashboard/events/6ba46f80-9f4d-47f7-a31d-3efed9d4be50#leagues"
       target="_blank" rel="noopener noreferrer"
       aria-label="Participating teams on AVISengine">
      <div class="logo-ring">
        <img src="assets/emblem.svg" alt="FIRA emblem">
      </div>
      <span class="link-label">AVISengine — Teams</span>
    </a>

  </nav>

  <!-- QR code — links to this page when scanned -->
  <div class="qr-section">
    <div id="qrcode"></div>
    <span class="qr-label">Scan to open this page</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    (function () {
      // Use the canonical deployed URL so the QR works after pushing to GitHub Pages
      var pageUrl = 'https://onemetrictony.github.io/FIRARobocup2026/links.html';

      QRCode.toCanvas(document.createElement('canvas'), pageUrl, {
        width: 148,
        margin: 1,
        color: { dark: '#ffffff', light: '#00000000' }
      }, function (err, canvas) {
        if (!err) {
          canvas.style.borderRadius = '6px';
          document.getElementById('qrcode').appendChild(canvas);
        }
      });
    })();
  </script>

</body>
</html>
