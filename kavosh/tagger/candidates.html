<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FIRA Candidates — who is this?</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #1a1e27;
      --panel2: #232838;
      --text: #eef1f7;
      --muted: #97a0b5;
      --accent: #4c8dff;
      --accent2: #2fbf71;
      --warn: #ffb020;
      --err: #ff6b6b;
      --border: #2c3346;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-text-size-adjust: 100%;
    }
    header {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      padding: 14px 22px; background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 700; }
    header nav { margin-left: auto; display: flex; gap: 14px; font-size: 14px; }
    header nav a { color: var(--muted); text-decoration: none; }
    header nav a:hover { color: var(--accent); }
    #intro {
      font-size: 13px; color: var(--text); background: rgba(76,141,255,.10);
      border-bottom: 1px solid var(--border); padding: 8px 22px; line-height: 1.4;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 24px 22px 60px; }
    #status { font-size: 14px; color: var(--muted); margin: 0 0 16px; min-height: 20px; text-align: center; }
    .progress-line { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: 24px; text-align: center;
    }
    .rep {
      width: 200px; height: 200px; object-fit: cover; border-radius: 14px;
      border: 1px solid var(--border); background: #10131b; display: block; margin: 0 auto 8px;
    }
    .rep-ph {
      width: 200px; height: 200px; border-radius: 14px; border: 1px solid var(--border);
      background: #10131b; display: flex; align-items: center; justify-content: center;
      font-size: 64px; color: var(--muted); margin: 0 auto 8px;
    }
    .cluster-size { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .cluster-size b { color: var(--accent2); }
    .examples { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
    .examples img {
      width: 52px; height: 52px; object-fit: cover; border-radius: 8px;
      border: 1px solid var(--border);
    }
    .q { font-size: 18px; font-weight: 700; margin: 0 0 6px; }
    .q-sub { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
    label.small { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; text-align: left; }
    select, input.inp-name {
      width: 100%; padding: 12px 10px; border-radius: 8px; font-size: 16px; font-family: inherit;
      background: #10131b; color: var(--text); border: 1px solid var(--border);
    }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 460px) { .row2 { grid-template-columns: 1fr; } }
    .contrib {
      margin-top: 12px; font-size: 13px; font-weight: 600; text-align: center;
      color: var(--muted); min-height: 18px;
    }
    .contrib.active { color: var(--accent2); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; justify-content: center; }
    button {
      padding: 13px 18px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--panel2); color: var(--text); cursor: pointer;
      font-weight: 600; font-family: inherit; font-size: 16px;
    }
    button:hover { border-color: var(--accent); }
    button.ok { background: var(--accent2); border-color: var(--accent2); color: #04240f; font-size: 17px; }
    button.ok:hover { filter: brightness(1.08); }
    button.danger:hover { border-color: var(--err); color: var(--err); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .done-banner {
      text-align: center; font-size: 20px; padding: 40px 20px; color: var(--text);
    }
    .done-banner a {
      display: inline-block; margin-top: 16px; color: #fff; background: var(--accent);
      border-color: var(--accent); padding: 10px 18px; border-radius: 8px;
      text-decoration: none; font-weight: 700; font-size: 15px;
    }
    .spinner {
      display: inline-block; width: 14px; height: 14px; border: 2px solid var(--muted);
      border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #toast {
      position: fixed; left: 50%; bottom: 26px;
      transform: translateX(-50%) translateY(12px);
      background: var(--accent2); color: #04240f;
      font-weight: 700; font-size: 15px; padding: 12px 20px;
      border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.4);
      opacity: 0; pointer-events: none; z-index: 200;
      transition: opacity .2s ease, transform .2s ease;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header>
    <h1>🙂 Who is this?</h1>
    <nav>
      <a href="index.html">Tagger</a>
      <a href="scan.html">← Scan</a>
    </nav>
  </header>
  <div id="intro">Step 2 of 2 — each card is a group of faces the model thinks is one person. Tell us a <b>name</b>, a <b>team</b>, or both (either alone is fine) and every matching photo gets labeled.</div>

  <div class="wrap">
    <div id="status" role="status" aria-live="polite">Loading…</div>
    <div class="progress-line" id="progress" style="display:none"></div>
    <div id="stage"></div>
  </div>

  <!-- Shared datalist: union of every team's individuals across the whole roster -->
  <datalist id="all-individuals"></datalist>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
  (function () {
    'use strict';

    // Cross-origin API on the Railway relay (github.io -> railway).
    const API = 'https://kavosh-relay-production.up.railway.app/tag';

    const els = {
      status: document.getElementById('status'),
      progress: document.getElementById('progress'),
      stage: document.getElementById('stage'),
      toast: document.getElementById('toast'),
      datalist: document.getElementById('all-individuals'),
    };

    let roster = [];       // [{team, league, individuals:[]}]
    let clusters = [];     // working queue (largest first)
    let rosterMax = 0;
    let totalClusters = 0; // K at load time (for "of K")
    let reviewed = 0;      // how many advanced past
    let busy = false;

    function setStatus(msg, spin) {
      els.status.innerHTML = (spin ? '<span class="spinner"></span>' : '') + msg;
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    async function init() {
      try {
        setStatus('Loading roster and candidates…', true);
        const [r, c] = await Promise.all([
          fetch(API + '/roster').then((x) => x.json()),
          fetch(API + '/clusters?eps=0.5').then((x) => x.json()),
        ]);
        roster = Array.isArray(r) ? r : [];
        clusters = (c && Array.isArray(c.clusters)) ? c.clusters.slice() : [];
        rosterMax = (c && typeof c.rosterMax === 'number') ? c.rosterMax : 0;
        totalClusters = (c && typeof c.count === 'number') ? c.count : clusters.length;
      } catch (e) {
        setStatus('⚠️ Could not load candidates: ' + escapeHtml(e.message), false);
        return;
      }
      buildNameDatalist();
      const rosterNote = rosterMax ? ' (roster has ~' + rosterMax + ')' : '';
      setStatus('Found ' + totalClusters + ' candidate people' + rosterNote + '.', false);
      renderCurrent();
    }

    // ---- flat union of ALL individuals across every team ----
    function allIndividuals() {
      const set = new Set();
      roster.forEach((t) => (t.individuals || []).forEach((n) => {
        if (n) set.add(n);
      }));
      return Array.from(set).sort((a, b) => a.localeCompare(b));
    }
    function buildNameDatalist() {
      els.datalist.innerHTML = allIndividuals()
        .map((n) => '<option value="' + escapeHtml(n) + '"></option>')
        .join('');
    }

    // ---- team dropdown (value = team name) ----
    function teamOptionsHtml() {
      let html = '<option value="">— select team —</option>';
      roster.forEach((t) => {
        html += '<option value="' + escapeHtml(t.team) + '">' + escapeHtml(t.team) +
          (t.league ? ' (' + escapeHtml(t.league) + ')' : '') + '</option>';
      });
      return html;
    }

    // ---- render current cluster ----
    function renderCurrent() {
      if (!clusters.length) {
        els.progress.style.display = 'none';
        els.stage.innerHTML = '<div class="done-banner">🎉 All candidates reviewed.' +
          '<br><a href="index.html">Back to tagger</a></div>';
        setStatus('Done — ' + reviewed + ' candidate(s) reviewed.', false);
        return;
      }
      const cl = clusters[0];
      const c = reviewed + 1;
      els.progress.style.display = '';
      els.progress.textContent = 'Candidate ' + c + ' of ' + totalClusters;

      const rep = cl.rep || {};
      const repImg = rep.thumb
        ? '<img class="rep" src="' + rep.thumb + '" alt="representative face" />'
        : '<div class="rep-ph">🙂</div>';

      let exHtml = '';
      const examples = Array.isArray(cl.exampleThumbs) ? cl.exampleThumbs : [];
      examples.forEach((t) => {
        if (t) exHtml += '<img src="' + t + '" alt="example face" />';
      });

      const size = cl.size || (Array.isArray(cl.faceIds) ? cl.faceIds.length : 0);

      els.stage.innerHTML =
        '<div class="card">' +
          repImg +
          '<div class="cluster-size">This group has <b>' + size + '</b> face(s) across the photos.</div>' +
          (exHtml ? '<div class="examples">' + exHtml + '</div>' : '') +
          '<p class="q">Who is this person?</p>' +
          '<p class="q-sub">Fill in a name, a team, or both — either one alone is fine.</p>' +
          '<div class="row2">' +
            '<div><label class="small">Name (optional)</label>' +
              '<input class="inp-name" list="all-individuals" placeholder="Search or type a name…" autocomplete="off" /></div>' +
            '<div><label class="small">Team (optional)</label>' +
              '<select class="sel-team">' + teamOptionsHtml() + '</select></div>' +
          '</div>' +
          '<div class="contrib" id="contrib">Add a name and/or a team above.</div>' +
          '<div class="actions">' +
            '<button class="ok" id="btn-yes" disabled>✓ Save</button>' +
            '<button id="btn-skip">Skip</button>' +
            '<button class="danger" id="btn-junk">🚫 Not a person / junk</button>' +
          '</div>' +
        '</div>';

      const inpName = els.stage.querySelector('.inp-name');
      const selTeam = els.stage.querySelector('.sel-team');
      const contrib = els.stage.querySelector('#contrib');
      const btnYes = els.stage.querySelector('#btn-yes');

      function refresh() {
        const name = (inpName.value || '').trim();
        const team = selTeam.value;
        let txt, active = true;
        if (name && team) txt = 'Contributing: name + team';
        else if (name) txt = 'Contributing: name only';
        else if (team) txt = 'Contributing: team only';
        else { txt = 'Add a name and/or a team above.'; active = false; }
        contrib.textContent = txt;
        contrib.classList.toggle('active', active);
        btnYes.disabled = !(name || team);
      }

      inpName.addEventListener('input', refresh);
      selTeam.addEventListener('change', refresh);
      btnYes.addEventListener('click', () => labelCurrent(inpName, selTeam));
      els.stage.querySelector('#btn-skip').addEventListener('click', () => advance(false));
      els.stage.querySelector('#btn-junk').addEventListener('click', () => advance(false));
    }

    async function labelCurrent(inpName, selTeam) {
      if (busy) return;
      const cl = clusters[0];
      if (!cl) return;
      const name = (inpName.value || '').trim();
      const team = selTeam.value;
      if (!name && !team) {
        setStatus('Add a name and/or a team first.', false);
        return;
      }
      const faceIds = Array.isArray(cl.faceIds) ? cl.faceIds : [];
      const body = { faceIds: faceIds };
      if (name) body.name = name;
      if (team) body.team = team;

      busy = true;
      const btn = els.stage.querySelector('#btn-yes');
      if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Saving…'; }
      try {
        await fetch(API + '/label-cluster', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        showToast('✓ labeled ' + faceIds.length + ' photo(s)');
      } catch (e) {
        setStatus('⚠️ Save failed: ' + escapeHtml(e.message), false);
        busy = false;
        if (btn) { btn.disabled = false; btn.innerHTML = '✓ Save'; }
        return;
      }
      busy = false;
      advance(true);
    }

    // Remove the current cluster from the queue and show the next one.
    function advance(labeled) {
      clusters.shift();
      reviewed++;
      renderCurrent();
    }

    // ---- toast ----
    let toastTimer = null;
    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { els.toast.classList.remove('show'); }, 1800);
    }

    init();
  })();
  </script>
</body>
</html>
