<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="lb.css?v=4">
</head>
<body>
<div class="wrap">
  <a class="brand" href="../index.html"><img src="kavosh-logo.png" alt="KAVOSH AI & Robotics Academy"></a>
  <header class="top">
    <div class="title-block">
      <h1 id="title">Leaderboard</h1>
      <div class="sub"><span id="subtitle">KAVOSH Challenge</span> <span class="accent-dot">&#9670;</span> Live</div>
    </div>
    <div class="head-tools">
      <button class="chip-btn" id="topToggle" title="Show top 3 or 4">Top 3</button>
    </div>
  </header>

  <section class="podium" id="podium" aria-label="Top performers"></section>
  <div class="empty" id="empty" hidden>No entries yet.</div>

  <footer class="foot">
    <span id="status" class="status"></span> &nbsp;&middot;&nbsp;
    <a href="admin.html">Data entry &#8594;</a>
  </footer>
</div>

<!-- Floating, draggable ice-cream cone counter -->
<div id="iceCone" title="Click to add a nag · drag to move">
  <span class="cone">&#127846;</span>
  <span class="count" id="coneCount">0</span>
</div>

<script src="config.js?v=4"></script>
<script src="store.js?v=4"></script>
<script>
  var PALETTE = ["#c8901d","#3f8fb2","#7a5cc4","#2f9e6f","#d9534f","#b9793f","#c44c8a","#4a6fd4"];
  var podium = document.getElementById("podium");
  var topN = parseInt(localStorage.getItem("lb.topN"), 10) || 3;
  if (topN !== 4) topN = 3;

  function colorFor(name){ var h=0; for (var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0; return PALETTE[h % PALETTE.length]; }
  var initials = LBStore.initials;
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }

  function render(state){
    document.getElementById("title").textContent = state.title;
    document.getElementById("subtitle").textContent = state.subtitle;
    document.title = state.title;

    var ranked = LBStore.rankSort(state.players, state.metric);
    document.getElementById("empty").hidden = ranked.length > 0;

    var rankOf = LBStore.ranks(ranked);
    var top = ranked.slice(0, topN);
    var order;
    if (topN === 3) { order = [top[1], top[0], top[2]]; }
    else { order = [top[1], top[0], top[2], top[3]]; }
    var medalCls = function(r){ return r === 1 ? "g" : r === 2 ? "s" : r === 3 ? "b" : "n"; };

    podium.className = "podium" + (topN === 4 ? " four" : "");
    podium.innerHTML = order.map(function(p, i){
      if (!p) return "<div></div>";
      var r = rankOf.get(p.id);
      var first = (i === 1); // centre slot is always the enlarged one
      var ch = p.change || 0;
      var tcls = ch>0?"up":ch<0?"down":"flat";
      var arrow = ch>0?"&#9650;":ch<0?"&#9660;":"&#8211;";
      var chTxt = ch===0 ? "&mdash;" : arrow + " " + Math.abs(ch).toLocaleString();
      var note = LBStore.latestNote(p);
      return '<div class="p-cell '+(first?"first":"")+'">'
        + '<div class="p-medal '+medalCls(r)+'">'+r+'</div>'
        + '<div class="p-card '+(first?"first":"")+'">'
        + '<div class="p-avatar" style="background:'+colorFor(p.name)+'">'+initials(p.name)+'</div>'
        + '<div class="p-name">'+esc(p.name)+'</div>'
        + '<div class="p-score">'+esc(LBStore.fmt(p.value, state.metric))+'</div>'
        + '<div class="p-trend '+tcls+'">'+chTxt+'</div>'
        + (note ? '<div class="p-note">&ldquo;'+esc(note)+'&rdquo;</div>' : '')
        + '</div></div>';
    }).join("");
  }

  var last = null;
  // Ice-cream nag cone count — kept in sync on every refresh (function hoisted).
  function updateCone(s){ var c = document.getElementById("coneCount"); if (c && s) c.textContent = s.annoyCount || 0; }
  function refresh(){
    LBStore.load().then(function(state){
      last = state; render(state); updateCone(state);
      var s = document.getElementById("status");
      s.className = "status ok";
      s.textContent = LBStore.hasBackend() ? "Synced " + new Date().toLocaleTimeString() : "Local preview (no backend)";
    }).catch(function(){
      var s = document.getElementById("status"); s.className = "status err"; s.textContent = "Offline";
    });
  }

  var toggle = document.getElementById("topToggle");
  function updateToggle(){ toggle.textContent = "Top " + topN; }
  updateToggle();
  toggle.onclick = function(){
    topN = topN === 3 ? 4 : 3;
    localStorage.setItem("lb.topN", topN);
    updateToggle();
    if (last) render(last);
  };

  refresh();
  // Cross-device liveness: poll the backend every 5s.
  if (LBStore.hasBackend()) setInterval(refresh, 5000);

  // Same-browser liveness: when the data-entry tab saves, localStorage changes
  // fire a 'storage' event here — render the new state instantly (no round-trip).
  window.addEventListener("storage", function (e) {
    if (!e.key || e.key.indexOf("kavosh.leaderboard") !== 0 || !e.newValue) return;
    try {
      var s = JSON.parse(e.newValue);
      last = s; render(s); updateCone(s);
      var st = document.getElementById("status");
      st.className = "status ok"; st.textContent = "Updated " + new Date().toLocaleTimeString();
    } catch (_) { refresh(); }
  });
  // Also refresh the instant the tab regains focus.
  window.addEventListener("focus", refresh);

  // Floating ice-cream cone: click to +1 (persists), drag to move (saved per browser).
  (function(){
    var cone = document.getElementById("iceCone");
    var CONE_KEY = "kavosh.iceCone.pos";
    try { var pos = JSON.parse(localStorage.getItem(CONE_KEY)); if (pos){ cone.style.left=pos.left+"px"; cone.style.top=pos.top+"px"; cone.style.right="auto"; cone.style.bottom="auto"; } } catch(e){}
    var dragging=false, moved=false, sx=0, sy=0, ox=0, oy=0;
    function down(e){
      dragging=true; moved=false;
      var pt = e.touches ? e.touches[0] : e;
      var r = cone.getBoundingClientRect(); ox=r.left; oy=r.top; sx=pt.clientX; sy=pt.clientY;
      cone.classList.add("dragging");
      document.addEventListener("mousemove", move); document.addEventListener("mouseup", up);
      document.addEventListener("touchmove", move, {passive:false}); document.addEventListener("touchend", up);
    }
    function move(e){
      if(!dragging) return;
      var pt = e.touches ? e.touches[0] : e;
      var dx=pt.clientX-sx, dy=pt.clientY-sy;
      if (Math.abs(dx)>4 || Math.abs(dy)>4) moved=true;
      var nx=Math.max(4, Math.min(window.innerWidth-cone.offsetWidth-4, ox+dx));
      var ny=Math.max(4, Math.min(window.innerHeight-cone.offsetHeight-4, oy+dy));
      cone.style.left=nx+"px"; cone.style.top=ny+"px"; cone.style.right="auto"; cone.style.bottom="auto";
      if (e.cancelable) e.preventDefault();
    }
    function up(){
      dragging=false; cone.classList.remove("dragging");
      document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up);
      document.removeEventListener("touchmove", move); document.removeEventListener("touchend", up);
      var r = cone.getBoundingClientRect();
      if (moved){ try { localStorage.setItem(CONE_KEY, JSON.stringify({left:Math.round(r.left), top:Math.round(r.top)})); } catch(e){} }
      else if (last){ // a click counts a nag
        last.annoyCount = (last.annoyCount||0)+1; updateCone(last);
        cone.classList.remove("pop"); void cone.offsetWidth; cone.classList.add("pop");
        LBStore.save(last);
      }
    }
    cone.addEventListener("mousedown", down);
    cone.addEventListener("touchstart", down, {passive:true});
  })();
</script>
<script src="bg.js?v=4"></script>
</body>
</html>
